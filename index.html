<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuera de Serie 2026</title>

<style>
  :root {
    --fondo: #799b78;
    --tinta: #3f1d47;
    --carta: #e9d2aa;
    --azul: #2b3f74;
    --naranja: #e06e2d;
    --rosa: #e0818e;
    --marron: #76352b;
    --rojo: #d82d32;
    --claro: #f3f1fb;
    --resaltador: #ffe066;
    --titulos: "Century Gothic", "Futura", "Avenir Next", "Trebuchet MS", sans-serif;
    --texto: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 12% 8%, rgba(15, 155, 142, .13), transparent 32rem),
      radial-gradient(circle at 92% 4%, rgba(214, 51, 108, .11), transparent 30rem),
      var(--fondo);
    color: var(--tinta);
    font-family: var(--texto);
  }

  main {
    max-width: 90rem;
    margin: 0 auto;
    padding: clamp(1.5rem, 4vw, 3.5rem) 1rem 3rem;
  }

  header { margin-bottom: clamp(1.5rem, 3vw, 2.5rem); }

  h1 {
    margin: 0;
    font-family: var(--titulos);
    font-size: clamp(2rem, 4.6vw, 3.8rem);
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -.02em;
    text-wrap: balance;
  }

  .sujeto {
    margin: .6rem 0 0;
    font-size: clamp(1.05rem, 1.7vw, 1.5rem);
  }

  /* ---------- Cartas ---------- */
  .tarjetas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(15.5rem, 1fr));
    gap: clamp(.8rem, 1.6vw, 1.4rem);
  }

  @media (min-width: 1100px) {
    .tarjetas { grid-template-columns: repeat(5, 1fr); }
  }

  .card {
    position: relative;
    display: block;
    perspective: 1200px;
    cursor: pointer;
  }

  .card input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    opacity: 0;
    cursor: pointer;
    z-index: 2;
  }

  .card:has(input:focus-visible) {
    outline: 4px solid var(--tinta);
    outline-offset: 5px;
    border-radius: 20px;
  }

  .inner {
    position: relative;
    height: 29rem;
    transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.2, .7, .2, 1);
  }

  @media (max-width: 700px) {
    .inner { height: 22rem; }
  }

  .card input:checked + .inner { transform: rotateY(180deg); }

  .cara {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    padding: 1.1rem;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 18px;
    border: 3px solid var(--tinta);
  }

  /* Frente */
  .frente {
    background: var(--carta);
    box-shadow: 0 6px 0 var(--tinta);
  }

  .frente h2 {
    margin: 0 0 .9rem;
    font-family: var(--titulos);
    font-size: clamp(1.4rem, 1.9vw, 1.8rem);
    line-height: 1.15;
    font-weight: 800;
    text-wrap: balance;
  }

  .arte {
    flex: 1;
    display: grid;
    place-items: center;
    background: var(--c);
    border-radius: 12px;
    border: 3px solid var(--tinta);
    overflow: hidden;
  }

  .arte svg {
    width: 55%;
    max-width: 8rem;
    height: auto;
    fill: none;
    stroke: #fff;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arte img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .pista {
    margin: .8rem 0 0;
    font-size: .9rem;
    text-align: center;
    opacity: .75;
  }

  /* Dorso */
  .dorso {
    transform: rotateY(180deg);
    background: var(--tinta);
    color: var(--claro);
    box-shadow: 0 6px 0 rgba(35, 31, 77, .35);
    border-top: 14px solid var(--c);
  }

  .dorso h3 {
    margin: .4rem 0 0;
    font-family: var(--titulos);
    font-size: clamp(1.2rem, 1.6vw, 1.5rem);
    font-weight: 800;
    line-height: 1.15;
  }

  .texto {
    margin: 1rem 0 0;
    font-size: clamp(1.05rem, 1.35vw, 1.3rem);
    line-height: 1.5;
  }

  .completar {
    background: var(--resaltador);
    color: #3a2f00;
    padding: 0 .25em;
    border-radius: 2px;
  }

  /* ---------- La sexta carta ---------- */
  .cierre {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    margin-top: clamp(2.2rem, 4.5vw, 3.4rem);
    min-height: 13rem;
  }

  .sexta {
    width: min(100%, 34rem);
    padding: 3px;
    border-radius: 20px;
    background: linear-gradient(115deg, var(--azul), var(--naranja), var(--rojo));
    box-shadow: 0 6px 0 var(--tinta);
    opacity: 0;
    transform: translateY(1rem) scale(.96);
  }

  .sexta-interior {
    display: flex;
    align-items: center;
    gap: 1.4rem;
    padding: 1.3rem 1.5rem;
    border-radius: 17px;
    background: var(--carta);
  }

  .sexta h2 {
    margin: 0;
    font-family: var(--titulos);
    font-size: clamp(1.4rem, 2.2vw, 1.9rem);
    font-weight: 800;
    line-height: 1.1;
    text-wrap: balance;
  }

  .sexta p {
    margin: .4rem 0 0;
    font-size: clamp(1rem, 1.4vw, 1.2rem);
    line-height: 1.4;
  }

  .tres {
    flex: none;
    display: flex;
    gap: .5rem;
  }

  .tres span {
    display: grid;
    place-items: center;
    width: 3.2rem;
    height: 3.2rem;
    border-radius: 50%;
    background: var(--c);
    border: 3px solid var(--tinta);
  }

  .tres svg {
    width: 62%;
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  main:has(#c1:checked):has(#c2:checked):has(#c3:checked):has(#c4:checked):has(#c5:checked) .sexta {
    animation: aparece .6s cubic-bezier(.2, .9, .3, 1.1) forwards;
  }

  @keyframes aparece {
    to { opacity: 1; transform: none; }
  }

  /* Si el navegador no soporta :has, la sexta carta queda visible */
  @supports not selector(:has(*)) {
    .sexta { opacity: 1; transform: none; }
  }

  @media (max-width: 560px) {
    .sexta-interior { flex-direction: column; align-items: flex-start; }
  }

  @media (prefers-reduced-motion: reduce) {
    .inner { transition: none; }
    main:has(#c1:checked):has(#c2:checked):has(#c3:checked):has(#c4:checked):has(#c5:checked) .sexta {
      animation: none;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>

<body>
<main>
  <header>
    <h1>Cinco cartas, una persona</h1>
    <p class="sujeto">Julieta. Candidata a Fuera de Serie.</p>
  </header>

  <section class="tarjetas" aria-label="Las cinco cartas">

    <label class="card" style="--c: var(--azul)">
      <input type="checkbox" id="c1">
      <div class="inner">
        <div class="cara frente">
          <h2>¿Quién soy?</h2>
          <div class="arte">
            <!-- Persona -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          </div>
          <p class="pista">Clic para dar vuelta</p>
        </div>
        <div class="cara dorso">
          <h3>¿Quién soy?</h3>
          <p class="texto">Hola! soy Julieta. Analista de datos en formación en la UBA y ex auditora Semi Senior de entidades financieras en EY.</p>
        </div>
      </div>
    </label>

    <label class="card" style="--c: var(--naranja)">
      <input type="checkbox" id="c2">
      <div class="inner">
        <div class="cara frente">
          <h2>¿Qué me diferencia?</h2>
          <div class="arte">
            <!-- Tres círculos que se cruzan -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg>
          </div>
          <p class="pista">Clic para dar vuelta</p>
        </div>
        <div class="cara dorso">
          <h3>¿Qué me diferencia?</h3>
          <p class="texto">Rigor de auditora, mirada creativa y curiosidad por la tecnología. Si me interesa algo, lo aprendo por mi cuenta.</p>
        </div>
      </div>
    </label>

    <label class="card" style="--c: var(--rojo)">
      <input type="checkbox" id="c3">
      <div class="inner">
        <div class="cara frente">
          <h2>¿Qué me inspira?</h2>
          <div class="arte">
            <!-- Brote -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 13c0-4-3-6-7-6 0 4 3 6 7 6z"/><path d="M12 11c0-3 2-5 6-5 0 3-2 5-6 5z"/></svg>
          </div>
          <p class="pista">Clic para dar vuelta</p>
        </div>
        <div class="cara dorso">
          <h3>¿Qué me inspira?</h3>
          <p class="texto">Ver cómo algo a lo que le invertí tiempo y esfuerzo toma forma y se vuelve real. Lo que consigo con trabajo propio me da más satisfacción que lo que llega gratis.</p>
        </div>
      </div>
    </label>

    <label class="card" style="--c: var(--rosa)">
      <input type="checkbox" id="c4">
      <div class="inner">
        <div class="cara frente">
          <h2>¿Cuál es mi desafío?</h2>
          <div class="arte">
            <!-- Escalera -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 21 8 21 8 16 13 16 13 11 18 11 18 6 21 6"/></svg>
          </div>
          <p class="pista">Clic para dar vuelta</p>
        </div>
        <div class="cara dorso">
          <h3>¿Cuál es mi desafío?</h3>
          <p class="texto">Crecer tanto personal como profesionalmente, en un entorno que me permita explotar mi capacidad analítica y mi imaginación.</p>
        </div>
      </div>
    </label>

    <label class="card" style="--c: var(--marron)">
      <input type="checkbox" id="c5">
      <div class="inner">
        <div class="cara frente">
          <h2>¿Por qué Fuera de Serie?</h2>
          <div class="arte">
            <!-- Estrella -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12 2 15 9 22 9.5 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9.5 9 9"/></svg>
          </div>
          <p class="pista">Clic para dar vuelta</p>
        </div>
        <div class="cara dorso">
          <h3>¿Por qué Fuera de Serie?</h3>
          <p class="texto">Quiero aprender cómo se utilizan los datos y la IA en estas cuatro grandes industrias, así como también su cultura de trabajo y valores.</p>
        </div>
      </div>
    </label>

  </section>

  <div class="cierre">
    <div class="sexta">
      <div class="sexta-interior">
        <div class="tres" aria-hidden="true">
          <span style="--c: var(--azul)"><svg viewBox="0 0 24 24"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="18" y1="20" x2="18" y2="9"/></svg></span>
          <span style="--c: var(--naranja)"><svg viewBox="0 0 24 24"><polyline points="8 6 2 12 8 18"/><polyline points="16 6 22 12 16 18"/></svg></span>
          <span style="--c: var(--rojo)"><svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></span>
        </div>
        <div>
          <h2>Una frase fuera de serie</h2>
          <p><i>"El trabajo duro sólo es una condena si carece de significado."</i></p>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
